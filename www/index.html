<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesap Makinesi</title>
<style>
:root{--bg:#f3e9dc;--panel:#fff8ef;--key:#ffffff;--ink:#2b2a3a;--fn:#e8dccb;--muted:#6b6880;--op:#e0708a;--eq1:#ff8fa3;--eq2:#d9566f;--line:rgba(43,42,58,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161f;--panel:#201e2c;--key:#2b2a3a;--ink:#f1ece4;--fn:#363347;--muted:#a19db5;--line:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161f;--panel:#201e2c;--key:#2b2a3a;--ink:#f1ece4;--fn:#363347;--muted:#a19db5;--line:rgba(255,255,255,.12);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;gap:8px}
.bar button{font:inherit;font-size:13px;color:var(--ink);background:var(--fn);border:0;border-radius:14px;padding:8px 14px;cursor:pointer}
.bar button.on{background:var(--op);color:#fff}
.by{font:italic 11px Georgia,serif;color:var(--muted);text-align:center}
.disp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 20px 14px;gap:6px;overflow:hidden}
.sub{font-size:20px;color:var(--muted);min-height:26px;max-width:100%;white-space:nowrap;overflow:hidden}
.big{font-size:60px;font-weight:600;line-height:1.1;white-space:nowrap;max-width:100%;text-align:right}
.big.err{color:var(--op);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sci{display:none;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 8px;grid-auto-rows:clamp(38px,5.6vh,50px)}
.app.sci-on .sci{display:grid}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 14px 16px;grid-auto-rows:clamp(52px,9.4vh,74px)}
.k{font:inherit;font-size:26px;border:0;border-radius:22px;background:var(--key);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .06s}
.k:active{transform:scale(.94)}
.sci .k{font-size:17px;border-radius:16px;background:var(--fn)}
.k.f{background:var(--fn)}
.k.o{background:var(--op);color:#fff}
.k.eq{background:linear-gradient(160deg,var(--eq1),var(--eq2));color:#fff}
.hist{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;z-index:5}
.app.h-on .hist{display:flex}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hh b{font-size:20px}
.hh button{font:inherit;font-size:13px;color:var(--ink);background:var(--fn);border:0;border-radius:14px;padding:8px 14px;cursor:pointer;margin-left:6px}
.hl{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.hi{padding:12px 4px;border-bottom:1px solid var(--line);text-align:right;cursor:pointer}
.hi small{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.hi span{font-size:24px;font-weight:600}
.none{color:var(--muted);text-align:center;margin-top:40px}
.hf{font:italic 12px Georgia,serif;color:var(--muted);text-align:center;padding-top:10px}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="bar">
  <button id="bh" data-k="hist">Geçmiş</button>
  <span class="by">Created by Yağız Ege</span>
  <button id="bs" data-k="sci">Bilimsel</button>
 </div>
 <div class="disp"><div class="sub" id="sub"></div><div class="big" id="big">0</div></div>
 <div class="sci">
  <button class="k" data-k="sin(">sin</button><button class="k" data-k="cos(">cos</button><button class="k" data-k="tan(">tan</button><button class="k" data-k="deg" id="bd">DEG</button>
  <button class="k" data-k="ln(">ln</button><button class="k" data-k="log(">log</button><button class="k" data-k="√(">√</button><button class="k" data-k="^">xʸ</button>
  <button class="k" data-k="π">π</button><button class="k" data-k="e">e</button><button class="k" data-k="!">x!</button><button class="k" data-k="sq">x²</button>
 </div>
 <div class="pad">
  <button class="k f" data-k="ac">AC</button><button class="k f" data-k="par">( )</button><button class="k f" data-k="%">%</button><button class="k o" data-k="÷">÷</button>
  <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k o" data-k="×">×</button>
  <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k o" data-k="−">−</button>
  <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button><button class="k o" data-k="+">+</button>
  <button class="k" data-k="0">0</button><button class="k" data-k=".">,</button><button class="k f" data-k="bk">⌫</button><button class="k eq" data-k="eq">=</button>
 </div>
 <div class="hist">
  <div class="hh"><b>Geçmiş</b><span><button data-k="hclr">Temizle</button><button data-k="hist">Kapat</button></span></div>
  <div class="hl" id="hl"></div>
  <div class="hf">Created by Yağız Ege</div>
 </div>
</div>
<script>
(function(){
var expr='',done=false,last='',deg=true,err=false,hist=[];
var app=document.getElementById('app'),big=document.getElementById('big'),sub=document.getElementById('sub'),hl=document.getElementById('hl');
try{hist=JSON.parse(localStorage.getItem('hesap-hist'))||[];}catch(e){hist=[];}
function save(){try{localStorage.setItem('hesap-hist',JSON.stringify(hist.slice(0,40)));}catch(e){}}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}}
var OPS='+−×÷^',FNS=['sin','cos','tan','ln','log','√'];
function fact(n){if(n<0||n>170||Math.floor(n)!==n)throw 0;var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function calc(str){
 var s=str.replace(/\s/g,''),o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
 while(o-->0)s+=')';
 var T=s.match(/\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|sin|cos|tan|ln|log|√|π|e|[+\u2212\u00d7\u00f7^!%()]/g)||[];
 if(T.join('').length!==s.length)throw 0;
 var p=0;
 function pk(){return T[p];}
 function nm(t){return t!==undefined&&/^[\d.]/.test(t);}
 function isF(t){return FNS.indexOf(t)>=0;}
 function ex(){var v=tm();while(pk()==='+'||pk()==='−'){var o=T[p++],r=tm();v=o==='+'?v+r:v-r;}return v;}
 function tm(){var v=un();for(;;){var t=pk();
  if(t==='×'||t==='÷'){p++;var r=un();if(t==='÷'){if(r===0)throw 0;v/=r;}else v*=r;}
  else if(t==='('||nm(t)||isF(t)||t==='π'||t==='e'){v*=un();}
  else break;}return v;}
 function un(){var t=pk();if(t==='−'){p++;return -un();}if(t==='+'){p++;return un();}return pw();}
 function pw(){var b=po();if(pk()==='^'){p++;return Math.pow(b,un());}return b;}
 function po(){var v=pr();for(;;){var t=pk();if(t==='!'){p++;v=fact(v);}else if(t==='%'){p++;v/=100;}else break;}return v;}
 function pr(){var t=T[p++];if(t===undefined)throw 0;
  if(nm(t))return parseFloat(t);
  if(t==='('){var v=ex();if(T[p++]!==')')throw 0;return v;}
  if(t==='π')return Math.PI;if(t==='e')return Math.E;
  if(isF(t)){var a=pr(),k=deg?Math.PI/180:1;
   if(t==='sin')return Math.sin(a*k);if(t==='cos')return Math.cos(a*k);
   if(t==='tan'){if(deg&&Math.abs(Math.cos(a*k))<1e-12)throw 0;return Math.tan(a*k);}
   if(t==='ln'){if(a<=0)throw 0;return Math.log(a);}
   if(t==='log'){if(a<=0)throw 0;return Math.log10(a);}
   if(t==='√'){if(a<0)throw 0;return Math.sqrt(a);}}
  throw 0;}
 var r=ex();if(p!==T.length||!isFinite(r))throw 0;return r;
}
function fmt(n){var r=parseFloat(n.toPrecision(12));if(Math.abs(r)<1e-12)r=0;var t=String(r);return t.charAt(0)==='-'?'\u2212'+t.slice(1):t;}
function show(t){return t.replace(/\d+(\.\d*)?/g,function(m){var q=m.split('.');q[0]=q[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return q.join(',');});}
function plain(){return /^[−]?\d*\.?\d*$/.test(expr);}
function render(){
 var b=err?'Hata':(expr?show(expr):'0');
 big.textContent=b;big.className='big'+(err?' err':'');
 var sz=60;big.style.fontSize=sz+'px';var mw=big.parentNode.clientWidth-40;
 while(big.scrollWidth>mw&&sz>18){sz-=2;big.style.fontSize=sz+'px';}
 var s='';
 if(done)s=show(last)+' =';
 else if(expr&&!plain()){try{s='= '+show(fmt(calc(expr)));}catch(e){s='';}}
 sub.textContent=s;
 document.getElementById('bd').textContent=deg?'DEG':'RAD';
 document.getElementById('bs').className=app.classList.contains('sci-on')?'on':'';
}
function lastCh(){return expr.charAt(expr.length-1);}
function isVal(c){return /[\d)!%πe]/.test(c);}
function fresh(){if(done){expr='';done=false;}}
function press(k){
 if(err&&k!=='ac'&&k!=='bk'){err=false;}
 if(/^\d$/.test(k)){fresh();expr+=k;}
 else if(k==='.'){fresh();var m=expr.match(/[\d.]*$/)[0];if(m.indexOf('.')>=0)return;if(m==='')expr+='0';expr+='.';}
 else if(OPS.indexOf(k)>=0){done=false;
  if(expr===''){if(k==='−')expr='−';}
  else{var c=lastCh();
   if(OPS.indexOf(c)>=0){if(expr.length>1||k==='−')expr=expr.slice(0,-1)+k;}
   else if(c==='('){if(k==='−')expr+=k;}
   else if(expr==='−'){}
   else expr+=k;}}
 else if(k==='%'||k==='!'){done=false;if(expr&&isVal(lastCh()))expr+=k;}
 else if(k==='π'||k==='e'){fresh();expr+=k;}
 else if(FNS.indexOf(k.replace('(',''))>=0){fresh();expr+=k;}
 else if(k==='sq'){done=false;if(expr&&isVal(lastCh()))expr+='^2';}
 else if(k==='par'){done=false;var o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
  if(o>0&&expr&&isVal(lastCh()))expr+=')';else expr+='(';}
 else if(k==='deg'){deg=!deg;}
 else if(k==='ac'){expr='';done=false;err=false;last='';}
 else if(k==='bk'){if(err){err=false;return render();}if(done){done=false;}
  else{var f=expr.match(/(sin|cos|tan|ln|log|√)\($/);expr=f?expr.slice(0,-f[0].length):expr.slice(0,-1);}}
 else if(k==='eq'){if(!expr||done)return;
  try{var r=fmt(calc(expr));hist.unshift({e:expr,r:r});if(hist.length>40)hist.pop();save();last=expr;expr=r;done=true;}
  catch(e){err=true;}}
 render();
}
function drawHist(){
 hl.innerHTML='';
 if(!hist.length){var n=document.createElement('div');n.className='none';n.textContent='Henüz işlem yok';hl.appendChild(n);return;}
 hist.forEach(function(h){var d=document.createElement('div');d.className='hi';
  var a=document.createElement('small');a.textContent=show(h.e)+' =';var b=document.createElement('span');b.textContent=show(h.r);
  d.appendChild(a);d.appendChild(b);
  d.addEventListener('click',function(){buzz();expr=h.r;done=false;err=false;app.classList.remove('h-on');render();});
  hl.appendChild(d);});
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-k]');if(!t)return;var k=t.getAttribute('data-k');buzz();
 if(k==='hist'){app.classList.toggle('h-on');if(app.classList.contains('h-on'))drawHist();return;}
 if(k==='hclr'){hist=[];save();drawHist();return;}
 if(k==='sci'){app.classList.toggle('sci-on');render();return;}
 press(k);
});
window.addEventListener('keydown',function(e){
 if(e.ctrlKey||e.metaKey)return;var k=e.key,m={'*':'×','x':'×','/':'÷','-':'−','+':'+',',':'.','.':'.','Enter':'eq','=':'eq','Backspace':'bk','Escape':'ac','Delete':'ac','(':'par',')':'par','^':'^','%':'%','!':'!'};
 if(/^\d$/.test(k))press(k);else if(m[k]){e.preventDefault();press(m[k]);}
});
window.addEventListener('resize',render);
render();
})();
</script>
</body>
</html>
